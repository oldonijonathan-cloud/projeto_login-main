<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Refatorando</title>
    <link rel="icon" href="https://cache.refatorando.com/wp-content/uploads/2023/05/Favicon_Refatorando-1-100x100.png" type="image/x-icon">
    <link rel="stylesheet" href="./public/css/styles.css">
</head>
<body>
    <main class="login-container">
        <section class="login-text">
            <div class="login-text-content">
                <h1>
                    Olá! <br>
                    Seja bem-vindo(a) de volta.
                </h1>
                <p>Faça login para continuar acessando a página</p>
            </div>
        </section>

        <section class="login-form">
            <div class="login-form-content">
                <img src="./public/images/Logo_Horizontal_colorida_Refatorando_1.png" alt="Refatorando" width="200">
                <h2>Faça seu login</h2>

                <form>
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" autocomplete="email" required>

                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Sua senha" autocomplete="current-password" required>

                    <a href="#" class="forgot-password">Esqueci minha senha</a>

                    <button type="submit">Entrar</button>
                </form>

                <div class="login-form-divider">
                    <span>ou faça login com</span>
                </div>

                <a href="#" class="login-form-google">
                    <img src="./public/images/google.svg" alt="" width="28" height="28">
                    <span>Entrar com Google</span>
                </a>

                <p class="login-form-subscribe">
                    Não tem uma conta? <a href="#">Inscreva-se</a>
                </p>
            </div>
        </section>
    </main>
</body>
</html>
